<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Use Case 2 — Architecture diagram from notes</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1d2430;
      --muted: #5c6777;
      --accent: #0f6e62;
      --warn: #7a4b00;
      --line: #d9d1c3;
      --hi: #d8efe9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header, main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    h2 { font-size: 1.15rem; margin: 0 0 8px; }
    .banner {
      background: #fff6e8;
      border: 1px solid #e6d3ae;
      color: var(--warn);
      padding: 10px 12px;
      border-radius: 8px;
      margin: 12px 0 18px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      font: inherit;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      font-weight: 650;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 8px;
    }
    button.secondary { background: #3d4a5c; }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px; vertical-align: top; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover, tr.selected { background: var(--hi); }
    .diagram { overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .sentence { padding: 8px; border-left: 3px solid var(--line); margin: 6px 0; background: #fff; }
    .sentence.active { border-left-color: var(--accent); background: var(--hi); }
    .chip {
      display: inline-block;
      background: #e7f3f0;
      color: var(--accent);
      border-radius: 999px;
      padding: 1px 8px;
      font-size: 0.8rem;
      margin-right: 4px;
    }
    .trace { font-size: 0.92rem; }
    .trace li { margin: 6px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Use Case 2 — Architecture diagram generation</h1>
    <p class="muted">Paste unstructured technical notes. The app extracts only components and flows that the notes support, then draws a downloadable diagram.</p>
    <div class="banner">Nothing is invented. Click a box, row, or sentence to see the quote and rule that produced it.</div>
  </header>
  <main>
    <section class="panel">
      <label for="notes">Technical notes</label>
      <textarea id="notes" placeholder="Paste notes here"></textarea>
      <div>
        <button class="secondary" type="button" id="example">Load exercise example</button>
        <button type="button" id="run">Generate diagram</button>
      </div>
    </section>
    <div id="out"></div>
  </main>
  <script>
    const notes = document.getElementById("notes");
    const out = document.getElementById("out");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    document.getElementById("example").onclick = async () => {
      const res = await fetch("/example");
      const data = await res.json();
      notes.value = data.notes || "";
    };

    document.getElementById("run").onclick = async () => {
      out.innerHTML = "<p class='muted'>Interpreting notes…</p>";
      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ notes: notes.value })
        });
        if (!res.ok) throw new Error(await res.text());
        render(await res.json());
      } catch (err) {
        out.innerHTML = `<p class="banner">${escapeHtml(err.message)}</p>`;
      }
    };

    function selectSentence(index) {
      document.querySelectorAll(".sentence").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });
      const target = document.querySelector(`.sentence[data-index="${index}"]`);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function render(data) {
      const sentences = data.sentences || [];
      const components = data.components.map(c => {
        const span = (c.evidence_spans || [])[0];
        const idx = span ? span.sentence_index : "";
        const matched = (c.evidence_spans || []).map(s => s.matched_text).join(", ");
        return `
        <tr class="clickable" data-sentence="${idx}">
          <td>${escapeHtml(c.name)}</td>
          <td>${escapeHtml(c.kind)}</td>
          <td>${escapeHtml(c.zone)}</td>
          <td>${escapeHtml(matched)}</td>
          <td class="muted">${escapeHtml((c.evidence || []).join(" "))}</td>
        </tr>`;
      }).join("");
      const connections = data.connections.map(c => `
        <tr class="clickable" data-sentence="${escapeHtml(c.sentence_index)}">
          <td>${escapeHtml(c.source_id)} → ${escapeHtml(c.target_id)}</td>
          <td>${escapeHtml(c.label)}</td>
          <td><span class="chip">${escapeHtml(c.rule)}</span></td>
          <td class="muted">${escapeHtml(c.evidence)}</td>
        </tr>`).join("");
      const amb = (data.ambiguities || []).map(a => `<li>${escapeHtml(a)}</li>`).join("") || "<li>None flagged.</li>";
      const sentenceBlock = sentences.map((s, i) => {
        const related = (data.extraction_trace || []).filter(e => e.sentence_index === i && e.action !== "ignored_sentence");
        const chips = related.map(e => `<span class="chip">${escapeHtml(e.rule)}</span>`).join("");
        return `<div class="sentence" data-index="${i}"><strong>S${i + 1}.</strong> ${escapeHtml(s)}<div>${chips}</div></div>`;
      }).join("");
      const trace = (data.extraction_trace || []).map(e => `
        <li data-sentence="${e.sentence_index ?? ""}">
          <span class="chip">${escapeHtml(e.action)}</span>
          <span class="chip">${escapeHtml(e.rule)}</span>
          ${escapeHtml(e.summary)}
        </li>`).join("");
      out.innerHTML = `
        <section class="panel">
          <p class="muted">${escapeHtml(data.disclaimer)}</p>
          <button type="button" id="download">Download SVG</button>
          <div class="diagram">${data.svg}</div>
        </section>
        <section class="panel">
          <h2>Notes with extraction links</h2>
          <p class="muted">Each sentence is tagged with the catalog or connection rule that fired.</p>
          ${sentenceBlock || "<p class='muted'>No sentences.</p>"}
        </section>
        <section class="panel">
          <h2>Components found in the notes</h2>
          <table>
            <thead><tr><th>Name</th><th>Kind</th><th>Zone</th><th>Matched phrase</th><th>Evidence</th></tr></thead>
            <tbody>${components}</tbody>
          </table>
        </section>
        <section class="panel">
          <h2>Connections</h2>
          <table>
            <thead><tr><th>Flow</th><th>Protocol / port</th><th>Rule</th><th>Evidence</th></tr></thead>
            <tbody>${connections}</tbody>
          </table>
        </section>
        <section class="panel">
          <h2>Ambiguous or insufficient information</h2>
          <ul>${amb}</ul>
        </section>
        <section class="panel">
          <h2>Extraction trace</h2>
          <p class="muted">Ordered decisions used to build the diagram. This is the audit trail for the interview demo.</p>
          <ol class="trace">${trace}</ol>
        </section>
      `;
      document.getElementById("download").onclick = () => {
        const blob = new Blob([data.svg], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "architecture.svg";
        a.click();
        URL.revokeObjectURL(url);
      };
      out.querySelectorAll("tr.clickable, .trace li").forEach((el) => {
        el.addEventListener("click", () => {
          const idx = Number(el.dataset.sentence);
          if (Number.isFinite(idx)) selectSentence(idx);
        });
      });
      out.querySelectorAll(".sentence").forEach((el) => {
        el.addEventListener("click", () => selectSentence(Number(el.dataset.index)));
      });
      out.querySelectorAll("g.node").forEach((el) => {
        el.style.cursor = "pointer";
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-id");
          const comp = (data.components || []).find((c) => c.id === id);
          const span = comp && (comp.evidence_spans || [])[0];
          if (span) selectSentence(span.sentence_index);
        });
      });
    }
  </script>
</body>
</html>
